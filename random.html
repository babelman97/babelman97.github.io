<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機數產生器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            padding: 40px 20px;
        }
        .button {
            padding: 20px 40px;
            font-size: 24px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
        }
        .number {
            font-size: 36px;
            color: #333;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            word-wrap: break-word;
            padding: 10px;
            width: 80%;
            text-align: center;
        }
        .input-field {
            margin: 10px 0;
            font-size: 18px;
            padding: 10px;
            width: 80px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div>最小數字　<input type="number" class="input-field" id="minValue" placeholder="000"></div>
    <div>最大數字　<input type="number" class="input-field" id="maxValue" placeholder="999"></div>
    <div>隨機個數　<input type="number" class="input-field" id="count" placeholder="1"></div>
    <button class="button" onclick="generateRandomNumbers()">產生隨機數</button>
    <div class="number" id="randomNumbers"></div>

    <script>
        function generateRandomNumbers() {
            const minValue = parseInt(document.getElementById('minValue').value);
            const maxValue = parseInt(document.getElementById('maxValue').value);
            const count = parseInt(document.getElementById('count').value);
            const range = maxValue - minValue + 1;

            if (isNaN(minValue) || isNaN(maxValue) || isNaN(count) || minValue >= maxValue || count <= 0 || count > range) {
                document.getElementById('randomNumbers').innerText = '請確保輸入正確的數值範圍和數量';
                return;
            }

            const start = performance.now();
            let result;

            // Optimization: If requested count is more than 50% of the range,
            // it's faster to pick (range - count) numbers to EXCLUDE.
            // This avoids the "Coupon Collector's Problem" where finding the last few unique numbers
            // becomes exponentially slower as the set fills up.
            if (count > range / 2) {
                const excludeCount = range - count;
                const excluded = new Set();
                while (excluded.size < excludeCount) {
                    const num = Math.floor(Math.random() * range) + minValue;
                    excluded.add(num);
                }
                result = [];
                for (let i = minValue; i <= maxValue; i++) {
                    if (!excluded.has(i)) {
                        result.push(i);
                    }
                }
                // Shuffle the result as it was generated in order
                for (let i = result.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [result[i], result[j]] = [result[j], result[i]];
                }
            } else {
                const randomSet = new Set();
                while (randomSet.size < count) {
                    const num = Math.floor(Math.random() * range) + minValue;
                    randomSet.add(num);
                }
                result = Array.from(randomSet);
            }

            const end = performance.now();
            console.log(`Generation took ${end - start}ms`);

            document.getElementById('randomNumbers').innerText = result.join(', ');
        }
    </script>
</body>
</html>
