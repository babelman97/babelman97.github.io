<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機數產生器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        .button {
            padding: 20px 40px;
            font-size: 24px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
        }
        .number {
            font-size: 36px;
            color: #333;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            width: 80%;
            word-wrap: break-word;
            padding: 10px;
            border-radius: 5px;
            background: #fff;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }
        .input-field {
            margin: 10px 0;
            font-size: 18px;
            padding: 10px;
            width: 80px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div>最小數字　<input type="number" class="input-field" id="minValue" placeholder="000"></div>
    <div>最大數字　<input type="number" class="input-field" id="maxValue" placeholder="999"></div>
    <div>隨機個數　<input type="number" class="input-field" id="count" placeholder="1"></div>
    <button class="button" onclick="generateRandomNumbers()">產生隨機數</button>
    <div class="number" id="randomNumbers"></div>

    <script>
        /**
         * Generates unique random numbers using a hybrid strategy for optimal performance.
         * 1. High-density requests (>50% of range): Fisher-Yates shuffle (O(N) range).
         * 2. Low-density requests: Rejection sampling (O(N) count).
         * This avoids the "Coupon Collector's Problem" performance collapse.
         */
        function generateRandomNumbers() {
            const minInput = document.getElementById('minValue');
            const maxInput = document.getElementById('maxValue');
            const countInput = document.getElementById('count');
            const resultDisplay = document.getElementById('randomNumbers');

            const minValue = parseInt(minInput.value);
            const maxValue = parseInt(maxInput.value);
            const count = parseInt(countInput.value);
            const range = maxValue - minValue + 1;

            // Validation: Allow single-value ranges (min == max)
            if (isNaN(minValue) || isNaN(maxValue) || isNaN(count) || minValue > maxValue || count <= 0 || count > range) {
                resultDisplay.textContent = '請確保輸入正確的數值範圍和數量';
                return;
            }

            let results = [];

            // Optimization: Hybrid sampling strategy
            // If range is reasonably small and we need more than 50%, use shuffle
            if (range <= 10000000 && count > range / 2) {
                // Populate pool
                const pool = new Array(range);
                for (let i = 0; i < range; i++) {
                    pool[i] = minValue + i;
                }

                // Partial Fisher-Yates shuffle
                for (let i = 0; i < count; i++) {
                    const j = Math.floor(Math.random() * (range - i)) + i;
                    const temp = pool[i];
                    pool[i] = pool[j];
                    pool[j] = temp;
                }
                results = pool.slice(0, count);
            } else {
                // Sparse sampling: Rejection sampling with Set
                const randomSet = new Set();
                while (randomSet.size < count) {
                    const num = Math.floor(Math.random() * range) + minValue;
                    randomSet.add(num);
                }
                results = Array.from(randomSet);
            }

            // Using textContent for better performance on large strings
            resultDisplay.textContent = results.join(', ');
        }
    </script>
</body>
</html>
