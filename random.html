<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機數產生器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }
        .button {
            padding: 20px 40px;
            font-size: 24px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
            transition: background-color 0.2s;
        }
        .button:hover {
            background-color: #45a049;
        }
        .number {
            font-size: 36px;
            color: #333;
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
            overflow-wrap: break-word;
            max-width: 90vw;
            text-align: center;
        }
        .input-field {
            margin: 10px 0;
            font-size: 18px;
            padding: 10px;
            width: 80px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div>最小數字　<input type="number" class="input-field" id="minValue" placeholder="000"></div>
    <div>最大數字　<input type="number" class="input-field" id="maxValue" placeholder="999"></div>
    <div>隨機個數　<input type="number" class="input-field" id="count" placeholder="1"></div>
    <button class="button" onclick="generateRandomNumbers()">產生隨機數</button>
    <div class="number" id="randomNumbers"></div>

    <script>
        /**
         * ⚡ BOLT OPTIMIZATION:
         * Implements a hybrid sampling algorithm:
         * 1. Rejection Sampling (Set) for < 50% density (O(N) expected).
         * 2. Sparse Fisher-Yates (Map) for >= 50% density (O(N) guaranteed).
         * This prevents O(N^2+) performance collapse when count is close to range size.
         */
        function generateRandomNumbers() {
            const minValue = parseInt(document.getElementById('minValue').value);
            const maxValue = parseInt(document.getElementById('maxValue').value);
            const count = parseInt(document.getElementById('count').value);
            const display = document.getElementById('randomNumbers');

            // Validation: Allow single value range (min == max) if count is 1
            if (isNaN(minValue) || isNaN(maxValue) || isNaN(count) || minValue > maxValue || count <= 0 || count > (maxValue - minValue + 1)) {
                display.textContent = '請確保輸入正確的數值範圍和數量';
                return;
            }

            const rangeSize = maxValue - minValue + 1;
            const density = count / rangeSize;
            let results = [];

            // Prevent memory exhaustion for massive range high-density requests
            if (rangeSize > 10000000 && density >= 0.5) {
                display.textContent = '範圍太大，無法進行高密度抽樣';
                return;
            }

            if (density < 0.5) {
                // Low density: Rejection sampling with Set is efficient
                let randomNumbers = new Set();
                while (randomNumbers.size < count) {
                    let num = Math.floor(Math.random() * rangeSize) + minValue;
                    randomNumbers.add(num);
                }
                results = Array.from(randomNumbers);
            } else {
                // High density: Sparse Fisher-Yates avoids collisions
                let map = new Map();
                for (let i = 0; i < count; i++) {
                    let j = Math.floor(Math.random() * (rangeSize - i)) + i;

                    let valI = map.has(i) ? map.get(i) : i;
                    let valJ = map.has(j) ? map.get(j) : j;

                    results.push(valJ + minValue);
                    map.set(j, valI);
                    map.delete(i); // Free memory
                }
            }

            // textContent is faster than innerText/innerHTML for large strings
            display.textContent = results.join(', ');
        }
    </script>
</body>
</html>
