<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機數產生器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        .button {
            padding: 20px 40px;
            font-size: 24px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
        }
        #randomNumbers {
            font-size: 36px;
            color: #333;
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
            word-wrap: break-word;
            width: 80%;
            padding: 10px;
            border-radius: 5px;
            background: #fff;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }
        .input-field {
            margin: 10px 0;
            font-size: 18px;
            padding: 10px;
            width: 80px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div>最小數字　<input type="number" class="input-field" id="minValue" placeholder="000"></div>
    <div>最大數字　<input type="number" class="input-field" id="maxValue" placeholder="999"></div>
    <div>隨機個數　<input type="number" class="input-field" id="count" placeholder="1"></div>
    <button class="button" onclick="generateRandomNumbers()">產生隨機數</button>
    <div class="number" id="randomNumbers"></div>

    <script>
        function generateRandomNumbers() {
            const minEl = document.getElementById('minValue');
            const maxEl = document.getElementById('maxValue');
            const countEl = document.getElementById('count');
            const resultEl = document.getElementById('randomNumbers');

            let minValue = parseInt(minEl.value);
            let maxValue = parseInt(maxEl.value);
            let count = parseInt(countEl.value);

            const range = maxValue - minValue + 1;

            if (isNaN(minValue) || isNaN(maxValue) || isNaN(count) || minValue > maxValue || count <= 0 || count > range) {
                resultEl.textContent = '請確保輸入正確的數值範圍和數量';
                return;
            }

            let results = [];
            // Performance Optimization: Hybrid strategy for unique random selection
            // 1. For sparse requests (< 50% of range), use Set with rejection sampling - O(count) average
            // 2. For dense requests (>= 50% of range), use Fisher-Yates shuffle - O(range) worst case
            // This avoids the 'Coupon Collector's Problem' where rejection sampling becomes exponentially slow.
            if (count / range < 0.5) {
                let randomNumbers = new Set();
                while (randomNumbers.size < count) {
                    let randomNumber = Math.floor(Math.random() * range) + minValue;
                    randomNumbers.add(randomNumber);
                }
                results = Array.from(randomNumbers);
            } else {
                // Fisher-Yates based selection for high density
                let allNumbers = new Array(range);
                for (let i = 0; i < range; i++) {
                    allNumbers[i] = i + minValue;
                }

                // Partial shuffle: only shuffle up to 'count' elements
                for (let i = 0; i < count; i++) {
                    const j = Math.floor(Math.random() * (range - i)) + i;
                    [allNumbers[i], allNumbers[j]] = [allNumbers[j], allNumbers[i]];
                }
                results = allNumbers.slice(0, count);
            }

            // Using textContent instead of innerText for performance (avoids layout thrashing)
            resultEl.textContent = results.join(', ');
        }
    </script>
</body>
</html>
