<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機數產生器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .button {
            padding: 20px 40px;
            font-size: 24px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
        }
        .number {
            font-size: 36px;
            color: #333;
            margin-top: 10px;
            max-height: 50vh;
            overflow-y: auto;
            word-break: break-all;
            padding: 10px;
            width: 80%;
            text-align: center;
        }
        .input-field {
            margin: 10px 0;
            font-size: 18px;
            padding: 10px;
            width: 80px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div>最小數字　<input type="number" class="input-field" id="minValue" placeholder="000"></div>
    <div>最大數字　<input type="number" class="input-field" id="maxValue" placeholder="999"></div>
    <div>隨機個數　<input type="number" class="input-field" id="count" placeholder="1"></div>
    <button class="button" onclick="generateRandomNumbers()">產生隨機數</button>
    <div class="number" id="randomNumbers"></div>

    <script>
        function generateRandomNumbers() {
            const minValue = parseInt(document.getElementById('minValue').value);
            const maxValue = parseInt(document.getElementById('maxValue').value);
            const count = parseInt(document.getElementById('count').value);
            const resultElement = document.getElementById('randomNumbers');

            // Corrected validation: minValue > maxValue (to allow same values) and count > range
            if (isNaN(minValue) || isNaN(maxValue) || isNaN(count) || minValue > maxValue || count <= 0 || count > (maxValue - minValue + 1)) {
                resultElement.innerText = '請確保輸入正確的數值範圍和數量';
                return;
            }

            const rangeSize = maxValue - minValue + 1;
            let result = [];

            // Performance Optimization: Use hybrid sampling algorithm
            // O(N) complexity for all cases.
            if (count < rangeSize / 2) {
                // Low density: Rejection sampling with Set is memory efficient
                const randomNumbers = new Set();
                while (randomNumbers.size < count) {
                    randomNumbers.add(Math.floor(Math.random() * rangeSize) + minValue);
                }
                result = Array.from(randomNumbers);
            } else {
                // High density: Fisher-Yates shuffle is faster than rejection sampling
                // Cap range to 10M to prevent memory issues
                if (rangeSize > 10000000) {
                    resultElement.innerText = '範圍過大，請縮小範圍或減少數量';
                    return;
                }
                const pool = Array.from({ length: rangeSize }, (_, i) => i + minValue);
                for (let i = 0; i < count; i++) {
                    const j = Math.floor(Math.random() * (rangeSize - i)) + i;
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
                result = pool.slice(0, count);
            }

            resultElement.innerText = result.join(', ');
        }
    </script>
</body>
</html>
