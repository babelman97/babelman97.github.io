<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機數產生器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .button {
            padding: 20px 40px;
            font-size: 24px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
        }
        .number {
            font-size: 24px;
            color: #333;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            word-break: break-all;
            padding: 10px;
            width: 80%;
            text-align: center;
        }
        .input-field {
            margin: 10px 0;
            font-size: 18px;
            padding: 10px;
            width: 80px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div>最小數字　<input type="number" class="input-field" id="minValue" placeholder="000"></div>
    <div>最大數字　<input type="number" class="input-field" id="maxValue" placeholder="999"></div>
    <div>隨機個數　<input type="number" class="input-field" id="count" placeholder="1"></div>
    <button class="button" onclick="generateRandomNumbers()">產生隨機數</button>
    <div class="number" id="randomNumbers"></div>

    <script>
        /**
         * Optimized unique random sampling.
         * For low density (< 50%), uses rejection sampling (Set).
         * For high density (>= 50%), uses Sparse Fisher-Yates (Map).
         * Performance: O(count) time and space.
         */
        function generateRandomNumbers() {
            const minValue = parseInt(document.getElementById('minValue').value);
            const maxValue = parseInt(document.getElementById('maxValue').value);
            const count = parseInt(document.getElementById('count').value);
            const output = document.getElementById('randomNumbers');

            const range = maxValue - minValue + 1;

            if (isNaN(minValue) || isNaN(maxValue) || isNaN(count) || minValue > maxValue || count <= 0 || count > range) {
                output.innerText = '請確保輸入正確的數值範圍和數量';
                return;
            }

            let results = [];

            // Optimization: If density is high, use Sparse Fisher-Yates to avoid collision overhead
            // Threshold of 50% is a heuristic for when rejection sampling slows down significantly
            if (count / range >= 0.5 && range <= 10000000) {
                // Sparse Fisher-Yates shuffle algorithm
                const map = new Map();
                for (let i = 0; i < count; i++) {
                    const j = Math.floor(Math.random() * (range - i)) + i;
                    const valI = map.has(i) ? map.get(i) : i;
                    const valJ = map.has(j) ? map.get(j) : j;

                    results.push(valJ + minValue);
                    map.set(j, valI);
                    // No need to set map(i) as we won't access it again
                }
            } else {
                // Rejection sampling (Set) is faster for low density
                const randomSet = new Set();
                while (randomSet.size < count) {
                    const num = Math.floor(Math.random() * range) + minValue;
                    randomSet.add(num);
                }
                results = Array.from(randomSet);
            }

            output.innerText = results.join(', ');
        }
    </script>
</body>
</html>
