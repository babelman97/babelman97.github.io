<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機數產生器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
            margin: 0;
        }
        .button {
            padding: 20px 40px;
            font-size: 24px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
        }
        .number {
            font-size: 36px;
            color: #333;
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
            word-break: break-all;
            padding: 10px;
            max-width: 90%;
            text-align: center;
        }
        .input-field {
            margin: 10px 0;
            font-size: 18px;
            padding: 10px;
            width: 80px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div>最小數字　<input type="number" class="input-field" id="minValue" placeholder="000"></div>
    <div>最大數字　<input type="number" class="input-field" id="maxValue" placeholder="999"></div>
    <div>隨機個數　<input type="number" class="input-field" id="count" placeholder="1"></div>
    <button class="button" onclick="generateRandomNumbers()">產生隨機數</button>
    <div class="number" id="randomNumbers"></div>

    <script>
        function generateRandomNumbers() {
            let minValue = parseInt(document.getElementById('minValue').value);
            let maxValue = parseInt(document.getElementById('maxValue').value);
            let count = parseInt(document.getElementById('count').value);
            let randomNumbers = new Set();

            const rangeSize = maxValue - minValue + 1;
            if (isNaN(minValue) || isNaN(maxValue) || isNaN(count) || minValue > maxValue || count <= 0 || count > rangeSize) {
                document.getElementById('randomNumbers').textContent = '請確保輸入正確的數值範圍和數量';
                return;
            }

            if (rangeSize > 10000000) {
                document.getElementById('randomNumbers').textContent = '範圍過大（最大支持 10,000,000）';
                return;
            }

            let result = [];
            // Optimization: Use Sparse Fisher-Yates for high density (>= 50%)
            // to avoid the "Coupon Collector's Problem" performance collapse.
            if (count > rangeSize / 2) {
                const map = new Map();
                for (let i = 0; i < count; i++) {
                    const j = Math.floor(Math.random() * (rangeSize - i)) + i;
                    const valI = map.has(i) ? map.get(i) : i;
                    const valJ = map.has(j) ? map.get(j) : j;
                    result.push(valJ + minValue);
                    map.set(j, valI);
                }
            } else {
                // Use rejection sampling for low density
                const selected = new Set();
                while (selected.size < count) {
                    const num = Math.floor(Math.random() * rangeSize);
                    selected.add(num + minValue);
                }
                result = Array.from(selected);
            }

            document.getElementById('randomNumbers').textContent = result.join(', ');
        }
    </script>
</body>
</html>
