<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機數產生器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .button {
            padding: 20px 40px;
            font-size: 24px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
        }
        .number {
            font-size: 36px;
            color: #333;
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
            overflow-wrap: break-word;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .input-field {
            margin: 10px 0;
            font-size: 18px;
            padding: 10px;
            width: 80px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div>最小數字　<input type="number" class="input-field" id="minValue" placeholder="000"></div>
    <div>最大數字　<input type="number" class="input-field" id="maxValue" placeholder="999"></div>
    <div>隨機個數　<input type="number" class="input-field" id="count" placeholder="1"></div>
    <button class="button" onclick="generateRandomNumbers()">產生隨機數</button>
    <div class="number" id="randomNumbers"></div>

    <script>
        /**
         * Optimized random number generation.
         * Uses rejection sampling for low density and Sparse Fisher-Yates for high density.
         * Time Complexity: O(count)
         */
        function generateRandomNumbers() {
            const resultEl = document.getElementById('randomNumbers');
            const minValue = parseInt(document.getElementById('minValue').value);
            const maxValue = parseInt(document.getElementById('maxValue').value);
            const count = parseInt(document.getElementById('count').value);

            // Validation
            if (isNaN(minValue) || isNaN(maxValue) || isNaN(count) || minValue > maxValue || count <= 0 || count > (maxValue - minValue + 1)) {
                resultEl.textContent = '請確保輸入正確的數值範圍和數量';
                return;
            }

            const range = maxValue - minValue + 1;
            let results = [];

            // Performance threshold: 50% density
            if (count < range / 2) {
                // Low density: Rejection sampling using a Set
                const seen = new Set();
                while (seen.size < count) {
                    const num = Math.floor(Math.random() * range) + minValue;
                    seen.add(num);
                }
                results = Array.from(seen);
            } else {
                // High density: Sparse Fisher-Yates shuffle (O(count) time and space)
                // Prevents performance collapse from "Coupon Collector's Problem" collisions.
                const map = new Map();
                for (let i = 0; i < count; i++) {
                    const j = Math.floor(Math.random() * (range - i)) + i;
                    const valI = map.get(i) ?? i;
                    const valJ = map.get(j) ?? j;
                    results.push(valJ + minValue);
                    map.set(j, valI);
                }
            }

            // Using textContent and joining in one go to minimize DOM updates
            resultEl.textContent = results.join(', ');
        }
    </script>
</body>
</html>
