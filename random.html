<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機數產生器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .button {
            padding: 20px 40px;
            font-size: 24px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
        }
        .number {
            font-size: 36px;
            color: #333;
            margin-top: 10px;
        }
        .input-field {
            margin: 10px 0;
            font-size: 18px;
            padding: 10px;
            width: 80px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div>最小數字　<input type="number" class="input-field" id="minValue" placeholder="000"></div>
    <div>最大數字　<input type="number" class="input-field" id="maxValue" placeholder="999"></div>
    <div>隨機個數　<input type="number" class="input-field" id="count" placeholder="1"></div>
    <button class="button" onclick="generateRandomNumbers()">產生隨機數</button>
    <div class="number" id="randomNumbers"></div>

    <script>
        // Cache DOM elements outside the function to avoid redundant lookups
        const minValueEl = document.getElementById('minValue');
        const maxValueEl = document.getElementById('maxValue');
        const countEl = document.getElementById('count');
        const resultEl = document.getElementById('randomNumbers');

        function generateRandomNumbers() {
            const minValue = parseInt(minValueEl.value);
            const maxValue = parseInt(maxValueEl.value);
            const count = parseInt(countEl.value);
            const range = maxValue - minValue + 1;

            if (isNaN(minValue) || isNaN(maxValue) || isNaN(count) || minValue >= maxValue || count <= 0 || count > range) {
                resultEl.innerText = '請確保輸入正確的數值範圍和數量';
                return;
            }

            let results;
            // Optimization: Hybrid sampling strategy.
            // For high-density requests (>50% of range), use exclusion-based sampling (Fisher-Yates shuffle)
            // to avoid the performance collapse of the Coupon Collector's Problem (rejection sampling).
            // For sparse requests, rejection sampling (Set) remains memory-efficient and fast.
            if (count > range / 2) {
                const pool = Array.from({ length: range }, (_, i) => minValue + i);
                for (let i = 0; i < count; i++) {
                    const j = i + Math.floor(Math.random() * (range - i));
                    // Swap
                    const temp = pool[i];
                    pool[i] = pool[j];
                    pool[j] = temp;
                }
                results = pool.slice(0, count);
            } else {
                const randomNumbers = new Set();
                while (randomNumbers.size < count) {
                    const randomNumber = Math.floor(Math.random() * range) + minValue;
                    randomNumbers.add(randomNumber);
                }
                results = Array.from(randomNumbers);
            }

            resultEl.innerText = results.join(', ');
        }
    </script>
</body>
</html>
