<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機數產生器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .button {
            padding: 15px 30px;
            font-size: 20px;
            margin-top: 20px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
            transition: background-color 0.2s;
        }
        .button:hover {
            background-color: #45a049;
        }
        .number {
            font-size: 24px;
            color: #333;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            overflow-wrap: break-word;
            width: 80%;
            max-width: 800px;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #ddd;
        }
        .input-group {
            margin: 10px 0;
            font-size: 18px;
        }
        .input-field {
            font-size: 18px;
            padding: 8px;
            width: 100px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>隨機數產生器</h1>
        <div class="input-group">最小數字<input type="number" class="input-field" id="minValue" value="1"></div>
        <div class="input-group">最大數字<input type="number" class="input-field" id="maxValue" value="100"></div>
        <div class="input-group">隨機個數<input type="number" class="input-field" id="count" value="1"></div>
        <button class="button" onclick="generateRandomNumbers()">產生隨機數</button>
        <div class="number" id="randomNumbers"></div>
    </div>

    <script>
        /**
         * ⚡ Bolt: Optimized unique random number generation.
         * For low density sampling (< 50%), rejection sampling with Set is efficient (O(count)).
         * For high density sampling (>= 50%), Sparse Fisher-Yates shuffle with Map is O(count)
         * and avoids collisions that plague rejection sampling (O(N log N) or worse).
         * Range cap of 10,000,000 prevents memory exhaustion.
         */
        function generateRandomNumbers() {
            const minValue = parseInt(document.getElementById('minValue').value);
            const maxValue = parseInt(document.getElementById('maxValue').value);
            const count = parseInt(document.getElementById('count').value);
            const resultDiv = document.getElementById('randomNumbers');

            // Validation
            if (isNaN(minValue) || isNaN(maxValue) || isNaN(count)) {
                resultDiv.textContent = '請輸入有效數字';
                return;
            }
            if (minValue > maxValue) {
                resultDiv.textContent = '最小數字不能大於最大數字';
                return;
            }
            if (count <= 0) {
                resultDiv.textContent = '個數必須大於 0';
                return;
            }
            const range = maxValue - minValue + 1;
            if (count > range) {
                resultDiv.textContent = `範圍內只有 ${range} 個不重複數字`;
                return;
            }
            if (range > 10000000) {
                resultDiv.textContent = '範圍過大 (最大支援 10,000,000)';
                return;
            }

            let result = [];

            // Performance optimization: Hybrid approach
            if (count < range / 2) {
                // Low density: Rejection sampling is fast and memory efficient
                const picked = new Set();
                while (picked.size < count) {
                    const num = Math.floor(Math.random() * range) + minValue;
                    picked.add(num);
                }
                result = Array.from(picked);
            } else {
                // High density: Sparse Fisher-Yates shuffle (O(count))
                // Avoids O(N^2) or high collision overhead of rejection sampling
                const map = new Map();
                for (let i = 0; i < count; i++) {
                    const j = Math.floor(Math.random() * (range - i)) + i;
                    const valI = map.has(i) ? map.get(i) : i + minValue;
                    const valJ = map.has(j) ? map.get(j) : j + minValue;
                    result.push(valJ);
                    map.set(j, valI);
                }
            }

            // Using textContent is faster than innerText for large data sets
            resultDiv.textContent = result.join(', ');
        }
    </script>
</body>
</html>
