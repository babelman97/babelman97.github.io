<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機數產生器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }
        .button {
            padding: 20px 40px;
            font-size: 24px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
            transition: transform 0.1s;
        }
        .button:active {
            transform: scale(0.98);
        }
        .number {
            font-size: 24px;
            color: #333;
            margin-top: 20px;
            max-width: 800px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .input-field {
            margin: 10px 0;
            font-size: 18px;
            padding: 10px;
            width: 80px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div>最小數字　<input type="number" class="input-field" id="minValue" placeholder="000"></div>
    <div>最大數字　<input type="number" class="input-field" id="maxValue" placeholder="999"></div>
    <div>隨機個數　<input type="number" class="input-field" id="count" placeholder="1"></div>
    <button class="button" onclick="generateRandomNumbers()">產生隨機數</button>
    <div class="number" id="randomNumbers"></div>

    <script>
        function generateRandomNumbers() {
            const minValue = parseInt(document.getElementById('minValue').value);
            const maxValue = parseInt(document.getElementById('maxValue').value);
            const count = parseInt(document.getElementById('count').value);
            const resultDiv = document.getElementById('randomNumbers');

            // 基礎驗證
            if (isNaN(minValue) || isNaN(maxValue) || isNaN(count) || count <= 0) {
                resultDiv.textContent = '請輸入正確的數值與數量';
                return;
            }

            if (minValue > maxValue) {
                resultDiv.textContent = '最小值不能大於最大值';
                return;
            }

            const rangeSize = maxValue - minValue + 1;

            if (count > rangeSize) {
                resultDiv.textContent = '數量不能超過範圍大小';
                return;
            }

            // 性能限制：防止極大範圍導致瀏覽器卡死
            if (rangeSize > 10000000) {
                resultDiv.textContent = '範圍過大（最大支援 10,000,000）';
                return;
            }

            let results = [];
            // 混合演算法：
            // 1. 低密度（< 50%）：使用 Set 拒絕採樣，平均時間複雜度 O(count)
            // 2. 高密度（>= 50%）：使用 Sparse Fisher-Yates (Map)，時間複雜度 嚴格 O(count)
            if (count < rangeSize / 2) {
                const randomNumbers = new Set();
                while (randomNumbers.size < count) {
                    const num = Math.floor(Math.random() * rangeSize) + minValue;
                    randomNumbers.add(num);
                }
                results = Array.from(randomNumbers);
            } else {
                const map = new Map();
                for (let i = 0; i < count; i++) {
                    const j = Math.floor(Math.random() * (rangeSize - i)) + i;
                    const valI = map.has(i) ? map.get(i) : i;
                    const valJ = map.has(j) ? map.get(j) : j;
                    results.push(valJ + minValue);
                    map.set(j, valI);
                }
            }

            // 使用 textContent 替代 innerText 以提升性能 (避免觸發回流)
            // 對於 100萬個數字，join 和 DOM 插入仍是主要瓶頸 (~0.5s-2s)
            resultDiv.textContent = results.join(', ');
        }
    </script>
</body>
</html>
