<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機數產生器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .button {
            padding: 20px 40px;
            font-size: 24px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
        }
        .number {
            font-size: 36px;
            color: #333;
            margin-top: 10px;
            max-height: 50vh;
            overflow-y: auto;
            word-wrap: break-word;
            text-align: center;
            width: 80%;
        }
        .input-field {
            margin: 10px 0;
            font-size: 18px;
            padding: 10px;
            width: 80px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div>最小數字　<input type="number" class="input-field" id="minValue" placeholder="000"></div>
    <div>最大數字　<input type="number" class="input-field" id="maxValue" placeholder="999"></div>
    <div>隨機個數　<input type="number" class="input-field" id="count" placeholder="1"></div>
    <button class="button" onclick="generateRandomNumbers()">產生隨機數</button>
    <div class="number" id="randomNumbers"></div>

    <script>
        function generateRandomNumbers() {
            const minValue = parseInt(document.getElementById('minValue').value);
            const maxValue = parseInt(document.getElementById('maxValue').value);
            const count = parseInt(document.getElementById('count').value);
            const resultEl = document.getElementById('randomNumbers');

            const rangeSize = maxValue - minValue + 1;
            if (isNaN(minValue) || isNaN(maxValue) || isNaN(count) || minValue > maxValue || count <= 0 || count > rangeSize) {
                resultEl.textContent = '請確保輸入正確的數值範圍和數量';
                return;
            }

            // Safety limit to prevent memory exhaustion
            if (rangeSize > 10000000) {
                 resultEl.textContent = '範圍太大，請縮小範圍（最大 10,000,000）';
                 return;
            }

            let results = [];

            // Performance Optimization:
            // 1. Low density (count <= rangeSize/2): Use a Set to pick unique numbers.
            // 2. High density (count > rangeSize/2): Use a Set to pick numbers to EXCLUDE.
            // This avoids the "Coupon Collector's Problem" where finding the last few unique
            // numbers becomes exponentially slower with random sampling.

            if (count <= rangeSize / 2) {
                const randomSet = new Set();
                while (randomSet.size < count) {
                    const randomNumber = Math.floor(Math.random() * rangeSize) + minValue;
                    randomSet.add(randomNumber);
                }
                results = Array.from(randomSet);
            } else {
                const excludeSet = new Set();
                const excludeCount = rangeSize - count;
                while (excludeSet.size < excludeCount) {
                    const randomNumber = Math.floor(Math.random() * rangeSize) + minValue;
                    excludeSet.add(randomNumber);
                }
                for (let i = minValue; i <= maxValue; i++) {
                    if (!excludeSet.has(i)) {
                        results.push(i);
                    }
                }
                // Shuffle the results to maintain the expectation of random order
                // using Fisher-Yates shuffle algorithm.
                for (let i = results.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [results[i], results[j]] = [results[j], results[i]];
                }
            }

            // Using textContent instead of innerText for slightly better performance (less layout thrashing)
            resultEl.textContent = results.join(', ');
        }
    </script>
</body>
</html>
