<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機數產生器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .button {
            padding: 20px 40px;
            font-size: 24px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
        }
        .number {
            font-size: 36px;
            color: #333;
            margin-top: 10px;
        }
        .input-field {
            margin: 10px 0;
            font-size: 18px;
            padding: 10px;
            width: 80px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div>最小數字　<input type="number" class="input-field" id="minValue" placeholder="000"></div>
    <div>最大數字　<input type="number" class="input-field" id="maxValue" placeholder="999"></div>
    <div>隨機個數　<input type="number" class="input-field" id="count" placeholder="1"></div>
    <button class="button" onclick="generateRandomNumbers()">產生隨機數</button>
    <div class="number" id="randomNumbers"></div>

    <script>
        function generateRandomNumbers() {
            const minValue = parseInt(document.getElementById('minValue').value);
            const maxValue = parseInt(document.getElementById('maxValue').value);
            const count = parseInt(document.getElementById('count').value);

            const rangeSize = maxValue - minValue + 1;

            if (isNaN(minValue) || isNaN(maxValue) || isNaN(count) || minValue >= maxValue || count <= 0 || count > rangeSize) {
                document.getElementById('randomNumbers').innerText = '請確保輸入正確的數值範圍和數量';
                return;
            }

            let result = [];

            // ⚡ Bolt: Use hybrid sampling to avoid the Coupon Collector's Problem.
            // If requested count is high relative to range (> 50%), use exclusion sampling (array swap).
            // Otherwise, use rejection sampling (Set) which is more memory efficient for sparse requests.
            if (count > rangeSize / 2) {
                const pool = Array.from({ length: rangeSize }, (_, i) => i + minValue);
                for (let i = 0; i < count; i++) {
                    const j = Math.floor(Math.random() * (rangeSize - i)) + i;
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
                result = pool.slice(0, count);
            } else {
                const randomNumbers = new Set();
                while (randomNumbers.size < count) {
                    const randomNumber = Math.floor(Math.random() * rangeSize) + minValue;
                    randomNumbers.add(randomNumber);
                }
                result = Array.from(randomNumbers);
            }

            document.getElementById('randomNumbers').innerText = result.join(', ');
        }
    </script>
</body>
</html>
